version: "3.9"

services:
  backend:
    build: ./backend
    container_name: renewsite-backend
    ports:
      - "8000:8000"
    volumes:
      - renewsite-data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/renewsite.db
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_long_random_string_in_production}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: renewsite-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  renewsite-data:
